<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mi Administración</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16181c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Administración">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root {
    --bg: #16181c;
    --card: #22252b;
    --card-2: #2b2f37;
    --text: #f2f2f2;
    --muted: #9aa0a8;
    --green: #4cd964;
    --red: #ff5b5b;
    --accent: #4ea8ff;
    --border: #34383f;

    /* Escala de radios (3 niveles + círculos/píldoras como excepción documentada) */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;

    /* Escala tipográfica compartida */
    --fs-hero: 24px;
    --fs-title: 19px;
    --fs-body: 15px;
    --fs-label: 15px;
    --fs-tile: 14px;
    --fs-meta: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #app { max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---- Login ---- */
  #loginScreen {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 32px 24px; gap: 16px;
  }
  #loginScreen h1 { text-align: center; margin: 0 0 8px; font-size: 26px; }
  #loginScreen p.sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  input, select, textarea {
    width: 100%; padding: 14px; border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 16px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); }
  label { font-size: 13px; color: var(--muted); margin-bottom: 4px; display: block; }
  .field { margin-bottom: 10px; }
  button {
    cursor: pointer; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 600;
  }
  .btn-primary {
    width: 100%; padding: 14px; background: var(--accent); color: #06101d;
  }
  .error-msg { color: var(--red); font-size: 13px; min-height: 18px; text-align: center; }
  .error-msg:empty { min-height: 0; }

  /* ---- Main screen ---- */
  #mainScreen { flex: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  .top-fixed { flex-shrink: 0; }
  .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  header {
    padding: calc(12px + env(safe-area-inset-top)) 20px 16px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  header .app-name { font-weight: 700; font-size: 18px; }
  header .logout { background: none; color: var(--muted); font-size: 13px; font-weight: 400; }

  .period-selector {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 1px 20px 0;
  }
  .period-nav { display: flex; align-items: center; justify-content: center; gap: 12px; flex: 1; }
  .period-arrow {
    /* círculo intencional (única excepción a la escala de radios) — ‹ › leen mejor redondos */
    background: var(--card); color: var(--text); width: 36px; height: 36px; border-radius: 50%;
    font-size: 18px; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .period-label { font-size: 16px; font-weight: 600; min-width: 130px; text-align: center; }
  .period-mode-select {
    padding: 7px 10px; border-radius: var(--radius-md); background: var(--card); color: var(--text);
    border: 1px solid var(--border); font-size: 13px; font-weight: 600;
  }

  .balance-card {
    position: relative; margin: 12px 20px; padding: 12px 20px; border-radius: var(--radius-md);
    background: var(--card); text-align: center;
  }
  .label-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .balance-card .label { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
  /* .eye-btn: excepción intencional sin caja/fondo — toggle pegado al texto "Saldo", no una acción de toolbar */
  .eye-btn { background: none; border: none; color: var(--muted); padding: 0; display: flex; align-items: center; justify-content: center; }
  .eye-btn svg { width: 14px; height: 14px; }
  .balance-card .amount { font-size: var(--fs-hero); font-weight: 700; }
  .balance-card .amount.pos { color: var(--green); }
  .balance-card .amount.neg { color: var(--red); }
  .balance-sub { display: flex; justify-content: space-around; margin-top: 6px; }
  .balance-sub div { text-align: center; }
  .balance-sub .v { font-size: 20px; font-weight: 600; }
  .balance-sub .l { font-size: var(--fs-meta); color: var(--muted); }

  .btn-add {
    border: 2px solid var(--green); background: transparent; color: var(--green);
    border-radius: var(--radius-md); font-weight: 300;
    display: flex; align-items: center; justify-content: center; padding: 0;
    width: 46px; height: 46px; font-size: 24px;
  }
  .balance-card .btn-add { position: absolute; top: 10px; left: 10px; }
  .btn-add.sm { width: 30px; height: 30px; font-size: 18px; border-radius: var(--radius-sm); }
  .btn-add.lg { width: 48px; height: 48px; font-size: 26px; }

  .balance-btn {
    position: absolute; top: 10px; width: 46px; height: 46px; border-radius: var(--radius-md);
    font-size: 24px; font-weight: 300; border: 2px solid; background: transparent;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .balance-btn.minus { right: 10px; color: var(--red); border-color: var(--red); }

  .search-row {
    padding: 0 20px; margin: 8px 0; display: flex; align-items: center;
    justify-content: space-between; gap: 8px;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--card-2);
    border: 1px solid var(--border); color: var(--muted); flex-shrink: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .view-toggle-group { display: flex; gap: 8px; margin-left: auto; }
  .resumen-icon { color: var(--accent); border-color: var(--accent); }
  .resumen-icon.active { background: var(--accent); color: #06101d; }

  .ahorros-block { padding: 0 20px; margin-bottom: 16px; }
  .ahorros-block .section-title { padding: 0; margin: 0 0 8px; }
  .ahorros-rows { background: var(--card-2); border-radius: var(--radius-md); overflow: hidden; }
  .ahorros-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; font-size: var(--fs-body); border-bottom: 1px solid var(--border);
  }
  .ahorros-row:last-child { border-bottom: none; }
  .ahorros-row .l { color: var(--muted); }
  .ahorros-row.total .l, .ahorros-row.total .v { font-weight: 700; }
  .empty-ahorros { padding: 0 20px; color: var(--muted); font-size: var(--fs-meta); }
  .btn-secondary.sm { padding: 6px 10px; font-size: var(--fs-meta); border-radius: var(--radius-sm); }
  .ahorros-extra-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .ahorros-extra-item {
    display: flex; align-items: center; gap: 10px; background: var(--card-2);
    border-radius: var(--radius-sm); border: none; padding: 9px 12px; width: 100%;
    color: var(--text); text-align: left; font-size: var(--fs-meta);
  }
  .ahorros-extra-item .d-fecha { color: var(--muted); flex-shrink: 0; }
  .ahorros-extra-item .d-desc { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ahorros-extra-item .d-monto.neg { color: var(--red); font-weight: 600; }
  .search-row input {
    flex: 1; width: auto; padding: 8px 14px; font-size: 14px; border-radius: var(--radius-md);
  }

  .section-title {
    padding: 0 20px; color: var(--muted); font-size: 13px; text-transform: uppercase;
    letter-spacing: .04em; margin: 8px 0;
  }
  #movList { padding: 0 20px 100px; display: flex; flex-direction: column; gap: 8px; }
  .mov-item {
    background: var(--card); border-radius: var(--radius-md); padding: 0 16px; height: 66px;
    display: flex; align-items: center; gap: 12px; border: none; width: 100%;
    color: var(--text); text-align: left;
  }
  .mov-item .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .mov-item .cat {
    font-size: var(--fs-body); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mov-item .desc {
    font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mov-item .right { flex-shrink: 0; text-align: right; }
  .mov-item .amt { font-size: 16px; font-weight: 700; }
  .mov-item .date { font-size: var(--fs-meta); color: var(--muted); margin-top: 2px; }
  .mov-item .amt.pos { color: var(--green); }
  .mov-item .amt.neg { color: var(--red); }
  .empty-msg { text-align: center; color: var(--muted); padding: 24px; font-size: 14px; }

  /* ---- Componente compartido: ícono-badge de color de categoría ---- */
  .icon-badge {
    width: 40px; height: 40px; border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0;
  }
  .icon-badge svg { width: 20px; height: 20px; }
  .icon-badge.sm { width: 28px; height: 28px; border-radius: var(--radius-sm); }
  .icon-badge.sm svg { width: 14px; height: 14px; }
  .icon-badge.lg { width: 48px; height: 48px; border-radius: var(--radius-md); }
  .icon-badge.lg svg { width: 24px; height: 24px; }

  /* ---- Modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal {
    background: var(--card); width: 100%; max-width: 480px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y: auto;
  }
  .modal h2 { margin: 0; font-size: var(--fs-title); }
  .modal-header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .fecha-pill-wrap { position: relative; flex-shrink: 0; }
  .fecha-pill-wrap span {
    display: inline-block; background: var(--card-2); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 7px 12px; font-size: 14px; color: var(--text); white-space: nowrap;
  }
  .fecha-pill-wrap input[type="date"] {
    position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; border: none;
  }
  .btn-secondary {
    padding: 11px 16px; background: var(--card-2); color: var(--text); border: 1px solid var(--border);
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-actions button { flex: 1; padding: 11px; }

  .desc-input-row { display: flex; align-items: center; gap: 8px; }
  .desc-input-row input[type="text"] { flex: 0 0 50%; min-width: 0; }
  .desc-input-row input#movDescripcion.with-usd-field { flex-basis: 25%; }
  .monto-usd-display {
    flex: 0 0 60px; min-width: 0; text-align: center; padding: 10px 4px;
    background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: var(--fs-label); font-weight: 700; color: var(--text);
  }
  .monto-usd-display.active { border-color: var(--accent); color: var(--accent); }
  .checks-row { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px 12px; flex: 1; }
  .check-row-inline {
    display: flex; align-items: center; gap: 5px; flex-shrink: 0; cursor: pointer;
    font-size: var(--fs-meta); color: var(--muted); white-space: nowrap;
  }
  .check-row-inline input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

  .modal-actions-3 { display: flex; gap: 8px; margin-top: 4px; align-items: stretch; }
  .modal-actions-3 .btn-secondary, .modal-actions-3 .btn-primary { flex: 1; padding: 11px; }
  .btn-icon-danger {
    flex: 0 0 46px; width: 46px; background: var(--card-2); color: var(--red);
    border: 1px solid var(--red); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .btn-icon-danger svg { width: 18px; height: 18px; }
  .btn-icon-danger.sm { flex: 0 0 28px; width: 28px; height: 28px; border-radius: var(--radius-sm); }
  .btn-icon-danger.sm svg { width: 14px; height: 14px; }

  /* botón ▲▼ de reordenar — una sola definición, se usa en Categorías y Descripciones */
  .reorder-btn { background: none; color: var(--muted); font-size: 11px; line-height: 1; padding: 4px 6px; }
  .reorder-btn:disabled { opacity: .25; }

  .new-cat-form { display: none; margin-top: 10px; padding: 14px; background: var(--card-2); border-radius: 12px; }
  .new-cat-form.show { display: block; }

  .monto-cat-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: stretch; }
  .cat-select-btn {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text);
    font-size: var(--fs-label); font-weight: 600; text-align: left;
  }
  .cat-select-btn.placeholder .cat-select-label { color: var(--muted); font-weight: 400; }
  .cat-select-btn .cat-select-label {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .amount-display {
    background: var(--card-2); border-radius: var(--radius-md); padding: 10px 16px; text-align: right;
    font-size: 24px; font-weight: 700; margin-bottom: 8px; border: 1px solid var(--border);
  }
  .amount-display-sm {
    flex: 0 0 38%; margin-bottom: 0; padding: 10px 6px; font-size: 22px; color: var(--text);
  }
  .amount-display-sm.pos { color: var(--green); }
  .amount-display-sm.neg { color: var(--red); }
  .amount-display-sm.active-target { border-color: var(--accent); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 32px; }
  .keypad .key {
    padding: 11px 0; background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    font-size: 20px; border-radius: var(--radius-md);
  }
  .keypad .key-back { color: var(--red); }

  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .cat-tile {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: 2px solid transparent; padding: 6px 2px; border-radius: var(--radius-md);
  }
  .cat-tile.selected { border-color: var(--accent); }
  .cat-tile .name {
    font-size: var(--fs-tile); font-weight: 600; color: var(--text); text-align: center; max-width: 80px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .desc-suggest-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .desc-suggest-chip {
    padding: 8px 14px; border-radius: var(--radius-lg); background: var(--card-2); border: 2px solid transparent;
    color: var(--text); font-size: 13px; font-weight: 600;
  }

  .header-actions { display: flex; align-items: center; gap: 14px; }
  /* Exportar: solo tiene sentido en desktop (pegar en Excel) — el celu nunca cumple este ancho */
  .export-wrap, .import-btn { display: none; }
  .export-wrap { position: relative; }
  @media (min-width: 700px) {
    .export-wrap { display: block; }
    .import-btn { display: flex; }
  }
  .export-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 50; min-width: 210px;
    background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 6px; display: flex; flex-direction: column; gap: 2px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .export-menu-item {
    text-align: left; padding: 9px 10px; border-radius: var(--radius-sm); background: none; border: none;
    color: var(--text); font-size: var(--fs-label);
  }
  .export-menu-item:hover { background: var(--card); }

  .icon-opt {
    background: var(--card-2); border: 2px solid transparent; border-radius: var(--radius-sm);
    padding: 8px 0; display: flex; align-items: center; justify-content: center; color: var(--text);
  }
  .icon-opt svg { width: 18px; height: 18px; }
  .icon-opt.selected { border-color: var(--accent); background: var(--card); color: var(--accent); }
  .icon-opt.used { opacity: .4; cursor: not-allowed; color: #fff; }
  .icon-opt.used.selected { opacity: .7; }

  .section-title-row {
    display: flex; align-items: center; justify-content: space-between;
  }

  .icon-grid-full {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 2px;
    max-height: 208px; overflow-y: auto; padding: 4px 2px;
  }
  .icon-grid-full .icon-opt {
    padding: 11px 0; border-radius: var(--radius-md);
  }
  .icon-grid-full .icon-opt svg { width: 20px; height: 20px; }

  .cat-manage-list {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
    overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-right: 2px;
  }
  #catListIngreso { max-height: 96px; }
  #catListEgreso { max-height: 200px; }
  .cat-card {
    background: var(--card-2); border-radius: var(--radius-md); padding: 4px 8px; height: 44px;
    display: flex; align-items: center; gap: 4px;
  }
  .cat-card-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: none;
    border: none; padding: 0; color: var(--text); text-align: left;
  }
  .cat-card-main .name {
    flex: 1; min-width: 0; font-size: var(--fs-tile); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cat-card-reorder { display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; }
  .desc-badge {
    min-width: 22px; height: 22px; padding: 0 5px; border-radius: 999px; flex-shrink: 0;
    background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    font-size: var(--fs-meta); font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .desc-badge.has-items { color: var(--accent); border-color: var(--accent); }

  .desc-manage-list {
    display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow-y: auto; padding-right: 2px;
  }
  .desc-row {
    background: var(--card-2); border-radius: var(--radius-md); padding: 8px 10px; display: flex; align-items: center; gap: 8px;
  }
  .desc-row .name {
    flex: 1; min-width: 0; font-size: var(--fs-label); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .empty-cat { color: var(--muted); font-size: 13px; padding: 6px 0; grid-column: 1 / -1; }

  .resumen-list { display: flex; flex-direction: column; gap: 6px; padding: 0 20px; }
  .resumen-row { background: var(--card-2); border-radius: var(--radius-md); overflow: hidden; }
  .resumen-row-main {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: none; border: none; color: var(--text); text-align: left;
  }
  .resumen-row-main .name {
    flex: 1; min-width: 0; font-size: var(--fs-body); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .resumen-row-main .count {
    font-size: var(--fs-meta); color: var(--muted); background: var(--card); border-radius: 999px;
    padding: 1px 7px; flex-shrink: 0;
  }
  .resumen-row-main .total { font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .resumen-row-main .total.pos { color: var(--green); }
  .resumen-row-main .total.neg { color: var(--red); }
  .resumen-row-main .chevron { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; transition: transform .15s; }
  .resumen-row.open .chevron { transform: rotate(180deg); }
  .resumen-detail { padding: 4px 10px 8px 52px; display: flex; flex-direction: column; gap: 6px; }
  .resumen-detail-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px;
    width: 100%; background: none; border: none; color: var(--text); text-align: left; padding: 2px 0;
  }
  .resumen-detail-item .d-fecha { color: var(--muted); flex-shrink: 0; }
  .resumen-detail-item .d-desc {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted);
  }
  .resumen-detail-item .d-monto { font-weight: 600; flex-shrink: 0; }
  .resumen-detail-item .d-monto.pos { color: var(--green); }
  .resumen-detail-item .d-monto.neg { color: var(--red); }
  .empty-cat-resumen { color: var(--muted); font-size: 13px; padding: 6px 0; }

  .import-summary {
    background: var(--card-2); border-radius: var(--radius-md); padding: 10px 14px;

<script>
const SUPABASE_URL = 'https://qqttdzxcamszgrbjrnnr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxdHRkenhjYW1zemdyYmpybm5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNjQzODcsImV4cCI6MjEwMDY0MDM4N30.rgK8c1qa-VZt5tto3M1oLddYaOIe2_NdX0NMQDDAVEw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentTipo = 'ingreso'; // tipo del movimiento que se está creando
let manageCatTipo = 'ingreso'; // tipo elegido en el form de la sección Categorías
let manageCatIcono = 'tag'; // ícono elegido en el form de la sección Categorías
let categorias = [];
let descripcionesFrecuentes = [];
let descManageCategoriaId = null; // categoría cuyas descripciones precargadas se están gestionando en el modal dedicado
let montoStr = '0'; // monto que se va tipeando en el teclado numérico
let montoUsdStr = '0'; // monto en U$D (AHORROS), se tipea con el mismo teclado
let activeAmountTarget = 'main'; // 'main' (pesos) | 'usd' — a cuál de los dos escribe el teclado
let currentMovs = []; // últimos movimientos cargados (para abrir edición sin re-consultar)
let editingMovId = null; // id del movimiento en edición (null = alta nueva)
let selectedCategoriaId = null; // categoría elegida para el movimiento que se está cargando/editando (Paso 2)

const CAT_COLORS = [
  '#ff6b6b','#4ecdc4','#ffa94d','#a78bfa','#4ea8ff','#4cd964','#f783ac','#f6c744',
  '#ff8fab','#63e6be','#748ffc','#66d9e8','#ff9f43','#95e06c','#e599f7','#c0eb75'
];
function hashColor(id) {
  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
  return CAT_COLORS[hash % CAT_COLORS.length];
}
// Color persistido en cada categoría (columna color); hashColor es solo un fallback
// transitorio para categorías que todavía no lo tienen migrado.
function colorOf(cat) {
  return cat.color || hashColor(cat.id);
}
// Primer color de la paleta no usado por otra categoría del mismo tipo; si ya se
// usaron todos, se reparte cíclicamente (con muchas categorías puede haber repetidos).
function nextAvailableColor(tipo, excludeId) {
  const used = new Set(categorias.filter(c => c.tipo === tipo && c.id !== excludeId).map(c => c.color).filter(Boolean));
  const free = CAT_COLORS.find(c => !used.has(c));
  return free || CAT_COLORS[used.size % CAT_COLORS.length];
}

const ICON_SET = [
  'tag','shopping-cart','utensils','home','car','bus','plane','bike','fuel',
  'heart-pulse','stethoscope','pill','dumbbell','scissors','shirt',
  'gift','piggy-bank','credit-card','wallet','banknote','coins','receipt',
  'briefcase','graduation-cap','book','gamepad-2','film','music','coffee',
  'martini','baby','dog','cat','wrench','zap','flame','droplet','phone','shield','star'
];

function iconSvg(name) {
  return `<i data-lucide="${name}"></i>`;
}

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const today = new Date();
let periodMode = 'month'; // 'day' | 'month' | 'year'
let periodYear = today.getFullYear();
let periodMonth = today.getMonth(); // 0-indexado
let periodDay = today.getDate();

const fmt = (n) => '$' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

function getPeriodRange() {
  if (periodMode === 'year') {
    return { start: `${periodYear}-01-01`, end: `${periodYear}-12-31` };
  }
  if (periodMode === 'day') {
    const d = `${periodYear}-${String(periodMonth + 1).padStart(2, '0')}-${String(periodDay).padStart(2, '0')}`;
    return { start: d, end: d };
  }
  const y = periodYear, m = periodMonth;
  const start = `${y}-${String(m + 1).padStart(2, '0')}-01`;
  const lastDay = new Date(y, m + 1, 0).getDate();
  const end = `${y}-${String(m + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
  return { start, end };
}

function renderPeriodLabel() {
  const label = document.getElementById('periodLabel');
  if (periodMode === 'year') label.textContent = `${periodYear}`;
  else if (periodMode === 'day') label.textContent = `${periodDay} de ${MESES[periodMonth]} ${periodYear}`;
  else label.textContent = `${MESES[periodMonth]} ${periodYear}`;
  document.getElementById('periodModeSelect').value = periodMode;
}

// La tarjeta de Saldo se ve siempre, en cualquier vista — pero solo loadMovimientos()
// la actualiza (renderBalance). Cuando la vista activa es Categorías o Ahorros hay que
// refrescarla aparte, si no queda desactualizada tras editar/borrar un movimiento.
async function refreshBalance() {
  const { start, end } = getPeriodRange();
  const { data, error } = await sb.from('movimientos')
    .select('monto, es_retiro, es_retiro_extra, categorias(tipo)')
    .gte('fecha', start).lte('fecha', end);
  if (error) { console.error(error); return; }
  renderBalance(data || []);
}

function refreshCurrentView() {
  if (inResumenView) { refreshBalance(); return loadResumen(); }
  if (inAhorrosView) { refreshBalance(); return loadAhorros(); }
  return loadMovimientos();
}

document.getElementById('prevPeriod').addEventListener('click', () => {
  if (periodMode === 'year') { periodYear--; }
  else if (periodMode === 'day') {
    const d = new Date(periodYear, periodMonth, periodDay - 1);
    periodYear = d.getFullYear(); periodMonth = d.getMonth(); periodDay = d.getDate();
  } else { periodMonth--; if (periodMonth < 0) { periodMonth = 11; periodYear--; } }
  renderPeriodLabel();
  refreshCurrentView();
});

document.getElementById('nextPeriod').addEventListener('click', () => {
  if (periodMode === 'year') { periodYear++; }
  else if (periodMode === 'day') {
    const d = new Date(periodYear, periodMonth, periodDay + 1);
    periodYear = d.getFullYear(); periodMonth = d.getMonth(); periodDay = d.getDate();
  } else { periodMonth++; if (periodMonth > 11) { periodMonth = 0; periodYear++; } }
  renderPeriodLabel();
  refreshCurrentView();
});

document.getElementById('periodModeSelect').addEventListener('change', (e) => {
  periodMode = e.target.value;
  renderPeriodLabel();
  refreshCurrentView();
});

// ---------- Auth ----------
const loginScreen = document.getElementById('loginScreen');
const mainScreen = document.getElementById('mainScreen');
const loginError = document.getElementById('loginError');

document.getElementById('loginBtn').addEventListener('click', async () => {
  loginError.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) loginError.textContent = error.message;
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (!confirm('¿Salir de la cuenta?')) return;
  await sb.auth.signOut();
});

sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    loginScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    initData();
  } else {
    mainScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
  }
});

// ---------- Data ----------
async function initData() {
  renderPeriodLabel();
  await loadCategorias();
  await loadDescripcionesFrecuentes();
  await loadMovimientos();
}

async function loadCategorias() {
  const { data, error } = await sb.from('categorias').select('*')
    .order('orden', { ascending: true, nullsFirst: false })
    .order('nombre');
  if (error) { console.error(error); return; }
  categorias = data || [];
  await ensureCategoryColors();
  renderCategoriaOptions();
}

async function loadDescripcionesFrecuentes() {
  const { data, error } = await sb.from('descripciones_frecuentes').select('*')
    .order('orden', { ascending: true, nullsFirst: false })
    .order('texto');
  if (error) { console.error(error); return; }
  descripcionesFrecuentes = data || [];
}

// Migración puntual: categorías creadas antes de tener color asignado (o con
// color repetido dentro de su tipo) reciben un color único la primera vez que se cargan.
async function ensureCategoryColors() {
  for (const tipo of ['ingreso', 'egreso']) {
    const seen = new Set();
    for (const c of categorias.filter(x => x.tipo === tipo)) {
      if (c.color && !seen.has(c.color)) { seen.add(c.color); continue; }
      const color = nextAvailableColor(tipo, c.id);
      seen.add(color);
      const { data } = await sb.from('categorias').update({ color }).eq('id', c.id).select().single();
      if (data) { const idx = categorias.findIndex(x => x.id === c.id); if (idx !== -1) categorias[idx] = data; }
    }
  }
}

function renderCategoriaOptions() {
  const grid = document.getElementById('catGrid');
  const filtered = categorias.filter(c => c.tipo === currentTipo);
  const tiles = filtered.map(c => `
    <button type="button" class="cat-tile ${c.id === selectedCategoriaId ? 'selected' : ''}" data-id="${c.id}">
      <div class="badge icon-badge lg" style="background:${colorOf(c)}">${iconSvg(c.icono || 'tag')}</div>
      <div class="name">${c.nombre}</div>
    </button>`).join('');
  grid.innerHTML = tiles + `
    <button type="button" class="cat-tile add-tile" id="toggleNewCat">
      <div class="badge icon-badge lg btn-add lg">+</div>
      <div class="name">Nueva</div>
    </button>`;
  if (window.lucide) lucide.createIcons();
}

// El monto principal (teclado) siempre queda en pesos y es lo que resta del Balance;
// cuando el ahorro es en U$D, este campo aparte guarda cuántos dólares se compraron
// realmente, ya que el tipo de cambio hace que ambos números no coincidan.
function isAhorroUsd() {
  const cat = categorias.find(c => c.id === selectedCategoriaId);
  const esAhorros = !!cat && cat.nombre === 'AHORROS' && cat.tipo === 'egreso';

// ---------- Exportar CSV (solo desktop) ----------
function csvEscape(value) {
  const str = String(value ?? '');
  return /[;"\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

// Hora actual (HH_MM) para que cada export tenga un nombre de archivo único y no se
// vayan acumulando "(1)", "(2)"... en la carpeta de Descargas al exportar varias veces.
function horaFilenameSlug() {
  const now = new Date();
  return `${String(now.getHours()).padStart(2, '0')}_${String(now.getMinutes()).padStart(2, '0')}`;
}

function periodoFilenameSlug() {
  if (periodMode === 'year') return `${periodYear}`;
  if (periodMode === 'day') return `${String(periodDay).padStart(2, '0')}-${String(periodMonth + 1).padStart(2, '0')}-${periodYear}`;
  return `${MESES[periodMonth].toLowerCase()}-${periodYear}`;
}

// Mismo formato que fmt() pero sin el "$" — separador de miles y sin decimales,
// legible directo por Excel es-AR (punto de miles, coma decimal) para sumar en una tabla dinámica.
function fmtCsvNumber(n) {
  return Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

function descargarCSV(filename, header, filas) {
  const BOM = String.fromCharCode(0xFEFF);
  const lineas = [header, ...filas].map(fila => fila.map(csvEscape).join(';'));
  const csv = BOM + lineas.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function exportMovimientosCSV() {
  const { start, end } = getPeriodRange();
  const { data, error } = await sb
    .from('movimientos')
    .select('fecha, monto, descripcion, categorias(nombre, tipo)')
    .gte('fecha', start)
    .lte('fecha', end)
    .order('fecha', { ascending: true });
  if (error) { console.error(error); return; }

  const filas = (data || []).map(m => {
    const tipo = m.categorias ? m.categorias.tipo : null;
    const signo = tipo === 'egreso' ? -1 : 1;
    const fecha = new Date(m.fecha + 'T00:00:00').toLocaleDateString('es-AR');
    const tipoStr = tipo === 'ingreso' ? 'Ingreso' : 'Gasto';
    const categoria = m.categorias ? m.categorias.nombre : '(sin categoría)';
    const montoStr = fmtCsvNumber(signo * Number(m.monto));
    return [fecha, tipoStr, categoria, m.descripcion || '', montoStr];
  });

  descargarCSV(`movimientos_${periodoFilenameSlug()}_${horaFilenameSlug()}.csv`,
    ['Fecha', 'Tipo', 'Categoría', 'Descripción', 'Monto'], filas);
}

async function exportResumenCSV() {
  const { start, end } = getPeriodRange();
  const { data, error } = await sb
    .from('movimientos')
    .select('monto, categoria_id, es_retiro, es_retiro_extra, categorias(nombre, tipo)')
    .gte('fecha', start).lte('fecha', end);
  if (error) { console.error(error); return; }

  const groups = {};
  for (const m of data || []) {
    if (!m.categorias) continue;
    if (m.es_retiro_extra) continue; // aislado, se exporta desde "Ahorros"
    const key = m.categoria_id;
    groups[key] = groups[key] || { cat: m.categorias, total: 0, cantidad: 0 };
    groups[key].total += m.es_retiro ? -Number(m.monto) : Number(m.monto);
    groups[key].cantidad++;
  }
  const filas = Object.values(groups)
    .sort((a, b) => b.total - a.total)
    .map(g => [g.cat.nombre, g.cat.tipo === 'ingreso' ? 'Ingreso' : 'Gasto', g.cantidad, fmtCsvNumber(g.total)]);

  descargarCSV(`resumen_${periodoFilenameSlug()}_${horaFilenameSlug()}.csv`,
    ['Categoría', 'Tipo', 'Cantidad de movimientos', 'Monto total'], filas);
}

async function exportAhorrosCSV() {
  const { data, error } = await sb
    .from('movimientos')
    .select('fecha, monto, monto_usd, descripcion, es_retiro, es_retiro_extra, categorias!inner(nombre, tipo)')
    .eq('categorias.nombre', 'AHORROS');
  if (error) { console.error(error); return; }

  const inicioMes = startOfCurrentMonth();
  const totales = new Map();
  const bucketDe = (ap) => {
    if (!totales.has(ap.key)) totales.set(ap.key, { label: ap.label, moneda: ap.moneda, ahorrado: 0, esteMes: 0, retiroExtra: 0 });
    return totales.get(ap.key);
  };
  for (const m of data || []) {
    const ap = apartadoDe(m.descripcion);
    const bucket = bucketDe(ap);
    const valor = ap.moneda === 'usd' && m.monto_usd != null ? Number(m.monto_usd) : Number(m.monto);
    if (m.es_retiro_extra) { bucket.retiroExtra += valor; continue; }
    const signo = m.es_retiro ? -1 : 1;
    if (m.fecha < inicioMes) bucket.ahorrado += signo * valor;
    else bucket.esteMes += signo * valor;
  }

  const hoy = new Date().toISOString().slice(0, 10).split('-').reverse().join('-');
  const filas = Array.from(totales.values()).map(t => {
    const subTotal = t.ahorrado + t.esteMes;
    const total = subTotal - t.retiroExtra;
    return [t.label, t.moneda === 'usd' ? 'U$D' : 'Pesos',
      fmtCsvNumber(t.ahorrado), fmtCsvNumber(t.esteMes),
      fmtCsvNumber(t.retiroExtra), fmtCsvNumber(total)];
  });

  descargarCSV(`ahorros_${hoy}_${horaFilenameSlug()}.csv`,
    ['Apartado', 'Moneda', 'Ahorrado', 'Este mes', 'Retiro Extra', 'Total'], filas);
}

function exportDescFrecuentesCSV() {
  // Usa las listas ya cargadas en memoria (categorias/descripcionesFrecuentes), que
  // respetan el orden manual (▲▼) tal cual se ve en la pantalla "Categorías" — a
  // propósito, no alfabético — para que sirva como maestro de referencia real.
  const filas = [];
  for (const tipo of ['egreso', 'ingreso']) {
    const tipoLabel = tipo === 'ingreso' ? 'Ingreso' : 'Gasto';
    for (const cat of categorias.filter(c => c.tipo === tipo)) {
      const descs = descripcionesFrecuentes.filter(d => d.categoria_id === cat.id);
      if (!descs.length) { filas.push([tipoLabel, cat.nombre, '']); continue; }
      for (const d of descs) filas.push([tipoLabel, cat.nombre, d.texto]);
    }
  }

  const hoy = new Date().toISOString().slice(0, 10).split('-').reverse().join('-');
  descargarCSV(`descripciones_${hoy}_${horaFilenameSlug()}.csv`, ['Tipo', 'Categoría', 'Descripción'], filas);
}

let amountsHidden = true; // arranca siempre oculto, no se recuerda entre sesiones
let lastIngresos = 0, lastEgresos = 0;

function renderBalance(movs) {
  let ingresos = 0, egresos = 0;
  for (const m of movs) {
    if (m.es_retiro_extra) continue; // no toca el Balance general, solo la vista Ahorros
    const tipo = m.categorias ? m.categorias.tipo : null;
    if (tipo === 'ingreso') ingresos += Number(m.monto);
    // Un retiro de AHORROS resta del total de Gastos (libera saldo) en vez de sumar
    // aparte — mismo efecto neto que antes se lograba editando el aporte original.
    else if (tipo === 'egreso') egresos += m.es_retiro ? -Number(m.monto) : Number(m.monto);
  }
  lastIngresos = ingresos;
  lastEgresos = egresos;
  const saldo = ingresos - egresos;
  const balanceEl = document.getElementById('balanceAmount');
  balanceEl.textContent = fmt(saldo); // el Saldo siempre se muestra, no se enmascara
  balanceEl.className = 'amount ' + (saldo >= 0 ? 'pos' : 'neg');
  renderIngresosEgresos();
}

function renderIngresosEgresos() {
  document.getElementById('totalIngresos').textContent = amountsHidden ? '********' : fmt(lastIngresos);
  document.getElementById('totalEgresos').textContent = amountsHidden ? '********' : fmt(lastEgresos);
}

function renderMovimientos(movs, emptyMsg) {
  const list = document.getElementById('movList');
  if (!movs.length) {
    list.innerHTML = `<div class="empty-msg">${emptyMsg || 'Todavía no hay movimientos. Usá + o − para cargar el primero.'}</div>`;
    return;
  }
  list.innerHTML = movs.map(m => {
    const tipo = m.categorias ? m.categorias.tipo : 'egreso';
    const retiroTag = m.es_retiro_extra ? ' (Retiro extra)' : (m.es_retiro ? ' (Retiro)' : '');
    const catName = (m.categorias ? m.categorias.nombre : '(sin categoría)') + retiroTag;
    // Un retiro libera saldo (resta del Gasto), así que se muestra igual que un ingreso.
    const sign = (tipo === 'ingreso' || m.es_retiro) ? '+' : '−';
    const cls = (tipo === 'ingreso' || m.es_retiro) ? 'pos' : 'neg';
    const fecha = new Date(m.fecha + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
    const iconBg = m.categorias ? colorOf(m.categorias) : '#5b6169';
    const iconName = m.categorias ? (m.categorias.icono || 'tag') : 'help-circle';
    return `
      <button type="button" class="mov-item" data-id="${m.id}">
        <div class="mov-icon icon-badge" style="background:${iconBg}">${iconSvg(iconName)}</div>
        <div class="mid">
          <div class="cat">${catName}</div>
          ${m.descripcion ? `<div class="desc">${m.descripcion}${m.monto_usd != null ? ' · U$D ' + Number(m.monto_usd).toLocaleString('es-AR') : ''}</div>` : ''}
        </div>
        <div class="right">
          <div class="amt ${cls}">${sign} ${fmt(m.monto)}</div>
          <div class="date ${cls}">${fecha}</div>
        </div>
      </button>`;
  }).join('');
  if (window.lucide) lucide.createIcons();
}

function pressKey(key) {

  if (key === 'back') {

  } else if (key === ',') {
    if (!str.includes(',')) str += ',';
  } else {
    str = str === '0' ? key : str + key;
  }
  if (isUsd) montoUsdStr = str; else montoStr = str;
  renderAmountDisplay();
}

// Permite cargar el monto con el teclado físico (útil en desktop) cuando el
// modal de carga está abierto en la Pantalla 1 y el foco no está en un campo
// de texto (Descripción, fecha, etc.) — si no, los dígitos van a ese campo.
document.addEventListener('keydown', (e) => {
  if (movModal.classList.contains('hidden') || stepMonto.classList.contains('hidden')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key >= '0' && e.key <= '9') { pressKey(e.key); e.preventDefault(); }
  else if (e.key === ',' || e.key === '.') { pressKey(','); e.preventDefault(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { pressKey('back'); e.preventDefault(); }
});

function nextOrden(tipo) {
  const same = categorias.filter(c => c.tipo === tipo);
  return same.length ? Math.max(...same.map(c => c.orden ?? 0)) + 1 : 0;
}

// Dentro de un mismo tipo (ingreso/gasto), no se permite repetir nombre ni ícono.
function catConflictError(tipo, nombre, icono, excludeId) {
  const same = categorias.filter(c => c.tipo === tipo && c.id !== excludeId);
  if (same.some(c => c.nombre.trim().toLowerCase() === nombre.trim().toLowerCase())) {
    return 'Ya existe una categoría con ese nombre';
  }
  if (same.some(c => (c.icono || 'tag') === icono)) {
    return 'Ya existe una categoría con ese ícono';
  }
  return null;
}

  const conflict = catConflictError(currentTipo, nombre, 'tag');
  if (conflict) {
    catStepError.textContent = conflict.includes('ícono')
      ? conflict + ' — creala desde "Categorías" eligiendo un ícono distinto'
      : conflict;
    return;
  }
  const { data: userData } = await sb.auth.getUser();
  const { data, error } = await sb.from('categorias')
    .insert({
      nombre, tipo: currentTipo, icono: 'tag', orden: nextOrden(currentTipo),
      color: nextAvailableColor(currentTipo), user_id: userData.user.id
    })
    .select().single();
  if (error) { catStepError.textContent = error.message; return; }
  categorias.push(data);
  document.getElementById('newCatNombre').value = '';
  newCatForm.classList.remove('show');
  selectCategoriaAndAdvance(data.id);
});

async function guardarMovimiento(categoria_id) {
  movError.textContent = '';
  const monto = parseFloat(montoStr.replace(',', '.'));
  const fecha = document.getElementById('movFecha').value;
  const descripcion = document.getElementById('movDescripcion').value.trim();
  const es_retiro = document.getElementById('esRetiroAhorro').checked;
  // Un aporte (checkbox destildado) nunca puede quedar marcado como retiro extra —
  // ese flag solo se puede tildar desde el modal de "Retiro Extra" en la vista Ahorros.
  const es_retiro_extra = es_retiro ? undefined : false;

  let monto_usd = null;
  if (isAhorroUsd()) {
    monto_usd = parseFloat(montoUsdStr.replace(',', '.'));
    if (!monto_usd || monto_usd <= 0) { movError.textContent = 'Ingresá el monto en U$D'; return; }
  }

  if (editingMovId) {
    const update = { monto, categoria_id, fecha, descripcion: descripcion || null, es_retiro, monto_usd };
    if (es_retiro_extra !== undefined) update.es_retiro_extra = es_retiro_extra;
    const { error } = await sb.from('movimientos')
      .update(update)
      .eq('id', editingMovId);
    if (error) { movError.textContent = error.message; return; }
  } else {
    const { data: userData } = await sb.auth.getUser();
    const { error } = await sb.from('movimientos').insert({
      monto, categoria_id, fecha, descripcion: descripcion || null, es_retiro, monto_usd,
      es_retiro_extra: false, user_id: userData.user.id
    });
    if (error) { movError.textContent = error.message; return; }
  }

  if (document.getElementById('saveAsFreqDesc').checked && descripcion) {
    const dup = descripcionesFrecuentes.some(d => d.categoria_id === categoria_id
      && d.texto.toLowerCase() === descripcion.toLowerCase());
    if (!dup) {
      const { data: userData } = await sb.auth.getUser();
      const { data, error } = await sb.from('descripciones_frecuentes')
        .insert({
          texto: descripcion, categoria_id, orden: nextOrdenDesc(categoria_id),
          user_id: userData.user.id
        })
        .select().single();
      if (!error) descripcionesFrecuentes.push(data);
    }
  }

  movModal.classList.add('hidden');
  await refreshCurrentView();
}

function renderCatManageLists() {
  const renderCards = (list) => list.length

        const count = descripcionesFrecuentes.filter(d => d.categoria_id === c.id).length;

async function handleCatReorder(e) {
  const btn = e.target.closest('.reorder-btn');
  if (!btn || btn.disabled) return;
  const id = btn.dataset.id;
  const dir = Number(btn.dataset.dir);
  const cat = categorias.find(c => c.id === id);
  const sameType = categorias.filter(c => c.tipo === cat.tipo).sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));
  const idx = sameType.findIndex(c => c.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= sameType.length) return;
  const other = sameType[swapIdx];
  const ordenA = cat.orden ?? idx;
  const ordenB = other.orden ?? swapIdx;
  const { error } = await sb.from('categorias').update({ orden: ordenB }).eq('id', cat.id);
  if (error) { catManageError.textContent = error.message; return; }
  await sb.from('categorias').update({ orden: ordenA }).eq('id', other.id);
  cat.orden = ordenB;
  other.orden = ordenA;
  renderCatManageLists();
}

function startOfCurrentMonth() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
}

function claseMoneda(descripcion) {
  const d = (descripcion || '').toLowerCase();
  return (d.includes('usd') || d.includes('u$d') || d.includes('dolar')) ? 'usd' : 'ars';
}

// Cada descripción frecuente de AHORROS (ej. "FCI U$D", "Efectivo U$D") define su
// propio apartado dentro de la vista Ahorros. Si la descripción no matchea ninguna,
// cae en un apartado genérico "Otros" separado solo por moneda.
function getApartadoFrecuentes() {
  const cat = categorias.find(c => c.nombre === 'AHORROS' && c.tipo === 'egreso');
  if (!cat) return [];
  return descripcionesFrecuentes
    .filter(d => d.categoria_id === cat.id)
    .slice()
    .sort((a, b) => b.texto.length - a.texto.length); // más específico primero
}

function apartadoDe(descripcion) {
  const desc = (descripcion || '').toLowerCase();
  const moneda = claseMoneda(descripcion);
  const match = getApartadoFrecuentes().find(d => desc.startsWith(d.texto.toLowerCase()));
  if (match) return { key: match.texto, label: match.texto, moneda };
  return { key: `otros-${moneda}`, label: moneda === 'usd' ? 'Otros (U$D)' : 'Otros (Pesos)', moneda };
}

let ahorrosMovsById = {}; // para poder editar un ítem de retiro extra tocado desde el listado

async function loadAhorros() {
  const { data, error } = await sb
    .from('movimientos')
    .select('id, fecha, monto, monto_usd, descripcion, es_retiro, es_retiro_extra, categoria_id, categorias!inner(id, nombre, tipo, icono, color)')
    .eq('categorias.nombre', 'AHORROS');
  const el = document.getElementById('ahorrosContent');
  if (error) { console.error(error); el.innerHTML = ''; return; }

  ahorrosMovsById = {};
  const inicioMes = startOfCurrentMonth();
  const totales = new Map();
  const bucketDe = (ap) => {
    if (!totales.has(ap.key)) totales.set(ap.key, { label: ap.label, moneda: ap.moneda, ahorrado: 0, esteMes: 0, retiroExtra: 0, extras: [] });
    return totales.get(ap.key);
  };
  for (const m of data) {
    ahorrosMovsById[m.id] = m;
    const ap = apartadoDe(m.descripcion);
    const bucket = bucketDe(ap);
    // En U$D el monto real ahorrado es monto_usd (lo comprado), no el monto en
    // pesos que salió del Balance — difieren por el tipo de cambio.
    const valor = ap.moneda === 'usd' && m.monto_usd != null ? Number(m.monto_usd) : Number(m.monto);
    if (m.es_retiro_extra) {
      bucket.retiroExtra += valor;
      bucket.extras.push(m);
      continue; // no entra en Ahorrado/Este mes, queda aparte
    }
    const signo = m.es_retiro ? -1 : 1;
    if (m.fecha < inicioMes) bucket.ahorrado += signo * valor;
    else bucket.esteMes += signo * valor;
  }

  const bloques = Array.from(totales.entries())
    .map(([key, t]) => ({ key, ...t }))
    .filter(t => t.ahorrado !== 0 || t.esteMes !== 0 || t.retiroExtra !== 0)
    .sort((a, b) => a.moneda !== b.moneda ? (a.moneda === 'usd' ? -1 : 1) : a.label.localeCompare(b.label));

  if (!bloques.length) {
    el.innerHTML = '<div class="empty-ahorros">Todavía no cargaste movimientos de AHORROS</div>';
    return;
  }

  el.innerHTML = bloques.map(t => {
    const subTotal = t.ahorrado + t.esteMes;
    const total = subTotal - t.retiroExtra;
    const conExtra = t.retiroExtra !== 0;
    const extraSorted = t.extras.slice().sort((a, b2) => b2.fecha.localeCompare(a.fecha));
    return `
      <div class="ahorros-block">
        <div class="section-title-row" style="padding:0 0 8px;">
          <div class="section-title" style="padding:0; margin:0;">${t.label}</div>
          <button type="button" class="btn-secondary sm add-retiro-extra-btn" data-label="${t.label}">+ Retiro Extra</button>
        </div>
        <div class="ahorros-rows">
          <div class="ahorros-row"><div class="l">Ahorrado</div><div class="v">${fmt(t.ahorrado)}</div></div>
          <div class="ahorros-row"><div class="l">Este mes</div><div class="v">${fmt(t.esteMes)}</div></div>
          ${conExtra ? `<div class="ahorros-row"><div class="l">Sub Total</div><div class="v">${fmt(subTotal)}</div></div>` : ''}
          ${conExtra ? `<div class="ahorros-row"><div class="l">Retiro Extra</div><div class="v">− ${fmt(t.retiroExtra)}</div></div>` : ''}
          <div class="ahorros-row total"><div class="l">Total</div><div class="v">${fmt(total)}</div></div>
        </div>
        ${conExtra ? `
          <div class="ahorros-extra-list">
            ${extraSorted.map(m => {
              const fecha = new Date(m.fecha + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
              return `
                <button type="button" class="ahorros-extra-item" data-id="${m.id}">
                  <div class="d-fecha">${fecha}</div>
                  <div class="d-desc">${m.descripcion || '-'}</div>
                  <div class="d-monto neg">${fmt(m.monto)}</div>
                </button>`;
            }).join('')}
          </div>` : ''}
      </div>`;
  }).join('');
}

document.getElementById('ahorrosContent').addEventListener('click', (e) => {

// ---------- Modal: Retiro Extra (compras/pagos grandes que impactan el acumulado) ----------
const retiroExtraModal = document.getElementById('retiroExtraModal');
const retiroExtraError = document.getElementById('retiroExtraError');
const deleteRetiroExtraBtn = document.getElementById('deleteRetiroExtraBtn');
let retiroExtraLabel = null;
let editingRetiroExtraMov = null; // movimiento en edición, null = alta nueva

function openRetiroExtraModal(label, mov) {
  editingRetiroExtraMov = mov || null;
  retiroExtraLabel = mov ? apartadoDe(mov.descripcion).label : label;
  document.getElementById('retiroExtraTitle').textContent =
    (mov ? 'Editar Retiro Extra — ' : 'Retiro Extra — ') + retiroExtraLabel;
  document.getElementById('retiroExtraMonto').value = mov ? formatMontoDisplay(String(mov.monto).replace('.', ',')) : '';
  // Al editar, solo se muestra/edita el texto libre que sigue al apartado (ej. "cocina"
  // en "FCI Pesos - cocina") — el apartado en sí no se toca desde acá.
  const textoLibre = mov ? mov.descripcion.slice(retiroExtraLabel.length).replace(/^\s*-\s*/, '') : '';
  document.getElementById('retiroExtraDescripcion').value = textoLibre;
  deleteRetiroExtraBtn.classList.toggle('hidden', !mov);
  retiroExtraError.textContent = '';
  retiroExtraModal.classList.remove('hidden');
}

document.getElementById('cancelRetiroExtra').addEventListener('click', () => {
  retiroExtraModal.classList.add('hidden');
});

deleteRetiroExtraBtn.addEventListener('click', async () => {
  if (!editingRetiroExtraMov) return;
  if (!confirm('¿Eliminar este retiro extra?')) return;
  const { error } = await sb.from('movimientos').delete().eq('id', editingRetiroExtraMov.id);
  if (error) { retiroExtraError.textContent = error.message; return; }
  retiroExtraModal.classList.add('hidden');
  await loadAhorros();
});

// Formatea con separador de miles mientras se tipea, conservando la posición del cursor.
document.getElementById('retiroExtraMonto').addEventListener('input', (e) => {
  const input = e.target;
  const prevLength = input.value.length;
  const prevCursor = input.selectionStart;
  const raw = input.value.replace(/[^\d,]/g, '');
  const formatted = formatMontoDisplay(raw);
  input.value = formatted;
  const diff = formatted.length - prevLength;
  const cursor = Math.max(0, prevCursor + diff);
  input.setSelectionRange(cursor, cursor);
});

document.getElementById('saveRetiroExtra').addEventListener('click', async () => {
  retiroExtraError.textContent = '';
  const monto = parseFloat(document.getElementById('retiroExtraMonto').value.replace(/\./g, '').replace(',', '.'));
  if (!monto || monto <= 0) { retiroExtraError.textContent = 'Ingresá un monto válido'; return; }

  const textoExtra = document.getElementById('retiroExtraDescripcion').value.trim();
  const descripcion = retiroExtraLabel + (textoExtra ? ' - ' + textoExtra : '');

  if (editingRetiroExtraMov) {
    if (!confirm(`¿Guardar los cambios de este retiro extra (${fmt(monto)})?`)) return;
    const { error } = await sb.from('movimientos')
      .update({ monto, descripcion })
      .eq('id', editingRetiroExtraMov.id);
    if (error) { retiroExtraError.textContent = error.message; return; }
  } else {
    const cat = categorias.find(c => c.nombre === 'AHORROS' && c.tipo === 'egreso');
    if (!cat) { retiroExtraError.textContent = 'No se encontró la categoría AHORROS'; return; }
    if (!confirm(`¿Confirmás el retiro extra de ${fmt(monto)} de ${retiroExtraLabel}? Resta directo del total ahorrado.`)) return;
    const { data: userData } = await sb.auth.getUser();
    const { error } = await sb.from('movimientos').insert({
      monto, categoria_id: cat.id, fecha: new Date().toISOString().slice(0, 10),
      descripcion, es_retiro: true, es_retiro_extra: true, user_id: userData.user.id
    });
    if (error) { retiroExtraError.textContent = error.message; return; }
  }

  retiroExtraModal.classList.add('hidden');
  await loadAhorros();
});

// ---------- Importar movimientos desde CSV (mismo formato que "Exportar > Movimientos") ----------
const IMPORT_HEADER = ['Fecha', 'Tipo', 'Categoría', 'Descripción', 'Monto'];
let importRows = [];

// Parser CSV chico: separador ";", campos entre comillas (con "" como comilla escapada),
// mismo formato que arma csvEscape() al exportar.
function parseCsvText(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ';') { row.push(field); field = ''; }
    else if (c === '\r') { /* ignorado, el corte de línea real es \n */ }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
}

function parseCsvFecha(str) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((str || '').trim());
  if (!m) return null;
  const day = Number(m[1]), month = Number(m[2]), year = Number(m[3]);
  const dt = new Date(year, month - 1, day);
  if (dt.getFullYear() !== year || dt.getMonth() !== month - 1 || dt.getDate() !== day) return null;
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function parseCsvMonto(str) {
  const s = (str || '').trim().replace(/\./g, '').replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFileInput').value = '';
  document.getElementById('importFileInput').click();
});

document.getElementById('importFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => processImportFile(reader.result);
  reader.readAsText(file, 'UTF-8');
});

function processImportFile(text) {
  // Un byte inválido en UTF-8 se decodifica como el carácter de reemplazo — si aparece,
  // el archivo no estaba realmente en UTF-8 (típico de guardar como "CSV" a secas).
  if (text.includes('�')) {
    alert('El archivo no está en UTF-8. Volvé a guardarlo desde Excel eligiendo "CSV UTF-8 (delimitado por comas)".');
    return;
  }
  const rows = parseCsvText(text);
  if (!rows.length) { alert('El archivo está vacío.'); return; }

  const header = rows[0].map(h => h.trim());
  const headerOk = header.length === IMPORT_HEADER.length && header.every((h, i) => h === IMPORT_HEADER[i]);
  if (!headerOk) {
    alert('Este archivo no tiene el formato esperado (Fecha;Tipo;Categoría;Descripción;Monto). Exportá "Movimientos" desde esta misma app para tener la estructura correcta.');
    return;
  }

  buildImportPreview(rows.slice(1));
}

async function buildImportPreview(dataRows) {
  const parsed = dataRows
    .filter(r => r.some(c => c.trim() !== ''))
    .map(r => {
      const [fechaRaw, tipoRaw, categoriaRaw, descripcionRaw, montoRaw] = r;
      const row = {
        fechaRaw: (fechaRaw || '').trim(),
        categoriaNombre: (categoriaRaw || '').trim(), // trim: evita categorías/descripciones
        descripcion: (descripcionRaw || '').trim(),   // "duplicadas" por un espacio de más del Excel
        error: null,
      };
      row.fechaIso = parseCsvFecha(row.fechaRaw);
      if (!row.fechaIso) row.error = 'Fecha inválida';

      if (!row.error) {
        const tipoNorm = (tipoRaw || '').trim().toLowerCase();
        if (tipoNorm === 'ingreso') row.tipo = 'ingreso';
        else if (tipoNorm === 'gasto') row.tipo = 'egreso';
        else row.error = 'Tipo inválido (debe ser Ingreso o Gasto)';
      }
      if (!row.error && !row.categoriaNombre) row.error = 'Falta la categoría';

      // El signo del monto no importa acá: quién manda es la columna Tipo. Así el
      // usuario puede tipear todo en positivo al armar el Excel a mano, sin acordarse
      // de poner el "-" en cada gasto.
      const monto = parseCsvMonto(montoRaw);
      if (!row.error && (monto === null || monto === 0)) row.error = 'Monto inválido';
      row.montoAbs = monto !== null ? Math.abs(monto) : null;
      return row;
    });

  for (const row of parsed) {
    if (row.error) continue;
    const catMatch = categorias.find(c => c.tipo === row.tipo && c.nombre.toLowerCase() === row.categoriaNombre.toLowerCase());
    row.categoriaId = catMatch ? catMatch.id : null;
    row.categoriaIsNew = !catMatch;
    const descMatch = row.categoriaId
      ? descripcionesFrecuentes.find(d => d.categoria_id === row.categoriaId && d.texto.toLowerCase() === row.descripcion.toLowerCase())
      : null;
    row.descripcionIsNew = row.descripcion !== '' && !descMatch;
  }

  // Duplicados: se compara contra los movimientos ya cargados en el rango de fechas del archivo.
  const fechasValidas = parsed.filter(r => r.fechaIso).map(r => r.fechaIso);
  let existentesKeys = new Set();
  if (fechasValidas.length) {
    const min = fechasValidas.reduce((a, b) => a < b ? a : b);
    const max = fechasValidas.reduce((a, b) => a > b ? a : b);
    const { data, error } = await sb.from('movimientos')
      .select('fecha, monto, categorias(nombre, tipo), descripcion')
      .gte('fecha', min).lte('fecha', max);
    if (!error) {
      existentesKeys = new Set((data || []).filter(m => m.categorias).map(m =>
        `${m.fecha}|${m.categorias.tipo}|${m.categorias.nombre.toLowerCase()}|${(m.descripcion || '').toLowerCase()}|${Number(m.monto)}`));
    }
  }
  for (const row of parsed) {
    if (row.error) continue;
    const key = `${row.fechaIso}|${row.tipo}|${row.categoriaNombre.toLowerCase()}|${row.descripcion.toLowerCase()}|${row.montoAbs}`;
    row.isDup = existentesKeys.has(key);
    existentesKeys.add(key); // así una fila repetida DENTRO del mismo archivo también se marca (la 1ª ocurrencia queda limpia, las siguientes iguales quedan como duplicado)
  }

  importRows = parsed;
  renderImportPreview();
  document.getElementById('importError').textContent = '';
  document.getElementById('importModal').classList.remove('hidden');
}

function renderImportPreview() {
  const list = document.getElementById('importList');
  list.innerHTML = importRows.map((row, i) => {
    if (row.error) {
      return `<div class="import-row error">
        <input type="checkbox" disabled>
        <div class="i-fecha">${row.fechaRaw || '-'}</div>
        <div class="i-error">${row.error}</div>
      </div>`;
    }
    const catTag = row.categoriaIsNew ? '<span class="import-tag nueva">nueva</span>' : '';
    const descTag = row.descripcionIsNew ? '<span class="import-tag nueva">nueva</span>' : '';
    const dupTag = row.isDup ? '<span class="import-tag dup">posible duplicado</span>' : '';
    const cls = row.tipo === 'ingreso' ? 'pos' : 'neg';
    const fechaFmt = new Date(row.fechaIso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
    return `<div class="import-row">
      <input type="checkbox" class="import-check" data-idx="${i}" ${row.isDup ? '' : 'checked'}>
      <div class="i-fecha">${fechaFmt}</div>
      <div class="i-mid">${row.categoriaNombre}${catTag} · ${row.descripcion || '(sin descripción)'}${descTag}${dupTag}</div>
      <div class="i-monto ${cls}">${fmt(row.montoAbs)}</div>
    </div>`;
  }).join('');
  updateImportSummary();
}

function updateImportSummary() {
  const checks = document.querySelectorAll('.import-check');
  let count = 0, dups = 0;
  const catsNuevas = new Set(), descsNuevas = new Set();
  const errores = importRows.filter(r => r.error).length;
  checks.forEach(chk => {
    const row = importRows[Number(chk.dataset.idx)];
    if (row.isDup) dups++;
    if (!chk.checked) return;
    count++;
    if (row.categoriaIsNew) catsNuevas.add(row.tipo + '|' + row.categoriaNombre.toLowerCase());
    if (row.descripcionIsNew) descsNuevas.add(row.tipo + '|' + row.categoriaNombre.toLowerCase() + '|' + row.descripcion.toLowerCase());
  });
  document.getElementById('importSummary').textContent =
    `${count} movimiento${count === 1 ? '' : 's'} a importar · ${catsNuevas.size} categoría${catsNuevas.size === 1 ? '' : 's'} nueva${catsNuevas.size === 1 ? '' : 's'} · `
    + `${descsNuevas.size} descripción${descsNuevas.size === 1 ? '' : 'es'} nueva${descsNuevas.size === 1 ? '' : 's'}`
    + (dups ? ` · ${dups} posible${dups === 1 ? '' : 's'} duplicado${dups === 1 ? '' : 's'}` : '')
    + (errores ? ` · ${errores} fila${errores === 1 ? '' : 's'} con error (excluida${errores === 1 ? '' : 's'})` : '');
  document.getElementById('confirmImport').disabled = count === 0;
}

document.getElementById('importList').addEventListener('change', (e) => {
  if (e.target.classList.contains('import-check')) updateImportSummary();
});

document.getElementById('cancelImport').addEventListener('click', () => {
  document.getElementById('importModal').classList.add('hidden');
});

document.getElementById('confirmImport').addEventListener('click', async () => {
  const importError = document.getElementById('importError');
  importError.textContent = '';
  const btn = document.getElementById('confirmImport');
  btn.disabled = true;

  const seleccionadas = [];
  document.querySelectorAll('.import-check').forEach(chk => {
    if (chk.checked) seleccionadas.push(importRows[Number(chk.dataset.idx)]);
  });
  if (!seleccionadas.length) { btn.disabled = false; return; }

  const { data: userData } = await sb.auth.getUser();
  const userId = userData.user.id;

  // 1) categorías nuevas (una por combinación tipo+nombre, para no duplicar si varias filas la comparten)
  const catsACrear = new Map();
  for (const row of seleccionadas) {
    if (row.categoriaIsNew) {
      const key = row.tipo + '|' + row.categoriaNombre.toLowerCase();
      if (!catsACrear.has(key)) catsACrear.set(key, { tipo: row.tipo, nombre: row.categoriaNombre });
    }
  }
  for (const c of catsACrear.values()) {
    const color = nextAvailableColor(c.tipo);
    const { data, error } = await sb.from('categorias')
      .insert({ nombre: c.nombre, tipo: c.tipo, color, user_id: userId })
      .select().single();
    if (error) { importError.textContent = error.message; btn.disabled = false; return; }
    categorias.push(data); // necesario ya acá para que nextAvailableColor no repita color en la próxima vuelta
    for (const row of seleccionadas) {
      if (row.categoriaIsNew && row.tipo === c.tipo && row.categoriaNombre.toLowerCase() === c.nombre.toLowerCase()) {
        row.categoriaId = data.id;
      }
    }
  }

  // 2) descripciones frecuentes nuevas
  const descsACrear = new Map();
  for (const row of seleccionadas) {
    if (row.descripcionIsNew && row.descripcion) {
      const key = row.categoriaId + '|' + row.descripcion.toLowerCase();
      if (!descsACrear.has(key)) descsACrear.set(key, { categoria_id: row.categoriaId, texto: row.descripcion });
    }
  }
  for (const d of descsACrear.values()) {
    const { data, error } = await sb.from('descripciones_frecuentes')
      .insert({ categoria_id: d.categoria_id, texto: d.texto, user_id: userId })
      .select().single();
    if (!error && data) descripcionesFrecuentes.push(data);
  }

  // 3) movimientos
  const movsAInsertar = seleccionadas.map(row => ({
    monto: row.montoAbs, categoria_id: row.categoriaId, fecha: row.fechaIso,
    descripcion: row.descripcion || null, es_retiro: false, es_retiro_extra: false,
    monto_usd: null, user_id: userId,
  }));
  const { error: insError } = await sb.from('movimientos').insert(movsAInsertar);
  if (insError) { importError.textContent = insError.message; btn.disabled = false; return; }

  document.getElementById('importModal').classList.add('hidden');
  btn.disabled = false;
  renderCategoriaOptions();
  await refreshCurrentView();
  alert(`Se importaron ${movsAInsertar.length} movimiento(s), ${catsACrear.size} categoría(s) nueva(s) y ${descsACrear.size} descripción(es) nueva(s).`);
});

async function loadResumen() {
  const { start, end } = getPeriodRange();
  const { data, error } = await sb
    .from('movimientos')
    .select('id, fecha, monto, descripcion, categoria_id, es_retiro, es_retiro_extra, categorias(id, nombre, tipo, icono, color)')
    .gte('fecha', start).lte('fecha', end);
  if (error) { console.error(error); return; }

  resumenMovsById = {};
  const groups = {};
  for (const m of data) {
    if (!m.categorias) continue; // los movimientos "(sin categoría)" no entran en este resumen
    if (m.es_retiro_extra) continue; // aislado, solo se ve en la vista Ahorros
    resumenMovsById[m.id] = m;
    const cid = m.categorias.id;
    groups[cid] = groups[cid] || { cat: m.categorias, total: 0, movs: [] };
    // Un retiro de AHORROS resta del total de la categoría (libera saldo), mismo
    // criterio que en la tarjeta de Saldo.
    groups[cid].total += m.es_retiro ? -Number(m.monto) : Number(m.monto);
    groups[cid].movs.push(m);
  }
  const all = Object.values(groups);
  const ingreso = all.filter(g => g.cat.tipo === 'ingreso').sort((a, b) => b.total - a.total);
  const gasto = all.filter(g => g.cat.tipo === 'egreso').sort((a, b) => b.total - a.total);

  renderResumenList('resumenIngresoList', ingreso, 'pos');
  renderResumenList('resumenGastoList', gasto, 'neg');
  if (window.lucide) lucide.createIcons();
}

function renderResumenList(elId, groups, cls) {
  const el = document.getElementById(elId);
  if (!groups.length) {
    el.innerHTML = '<div class="empty-cat-resumen">Sin movimientos en este período</div>';
    return;
  }
  el.innerHTML = groups.map(g => `
    <div class="resumen-row">
      <button type="button" class="resumen-row-main" data-cat="${g.cat.id}">
        <div class="badge icon-badge" style="background:${colorOf(g.cat)}">${iconSvg(g.cat.icono || 'tag')}</div>
        <div class="name">${g.cat.nombre}</div>
        <div class="count">${g.movs.length}</div>
        <div class="total ${cls}">${fmt(g.total)}</div>
        <i data-lucide="chevron-down" class="chevron"></i>
      </button>
      <div class="resumen-detail hidden"></div>
    </div>`).join('');
  el.querySelectorAll('.resumen-row-main').forEach(btn => {
    btn.addEventListener('click', () => toggleResumenDetail(btn, groups, cls));
  });
}

function toggleResumenDetail(btn, groups, cls) {
  const row = btn.closest('.resumen-row');
  const detail = row.querySelector('.resumen-detail');
  const isOpen = row.classList.toggle('open');
  if (!isOpen) { detail.classList.add('hidden'); return; }
  const g = groups.find(x => x.cat.id === btn.dataset.cat);
  const sorted = g.movs.slice().sort((a, b) => b.fecha.localeCompare(a.fecha));
  detail.innerHTML = sorted.map(m => {
    const fecha = new Date(m.fecha + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
    const desc = (m.descripcion || '-') + (m.es_retiro ? ' (Retiro)' : '');
    const montoCls = m.es_retiro ? 'pos' : cls;
    const sign = m.es_retiro ? '+ ' : '';
    return `
      <button type="button" class="resumen-detail-item" data-id="${m.id}">
        <div class="d-fecha">${fecha}</div>
        <div class="d-desc">${desc}</div>
        <div class="d-monto ${montoCls}">${sign}${fmt(m.monto)}</div>
      </button>`;
  }).join('');
  detail.classList.remove('hidden');
  if (window.lucide) lucide.createIcons();
}

resumenView.addEventListener('click', (e) => {
  const item = e.target.closest('.resumen-detail-item');
  if (!item) return;
  const mov = resumenMovsById[item.dataset.id];
  if (!mov) return;
  openEditMovModal(mov);
});
